<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo de Prodcutos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold">Modulo de Prodcutos</span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row vh-100">

            
            <aside class="col-2 bg-secondary text-white p-3">
                <h5 class="mb-4">Menú</h5>
                <ul class="nav flex-column">
                    <li><a href="secc"> Inicio</a></li>
                    <li><a href="secc"> Agregar Productos</a></li>
                    <li></li> <a href="secc"> Listar Productos</a></li>
                </ul>
            </aside>

           
            <main class="col-10 p-4">

                <h2 class="mb-1">Registro de Productos</h2>

                
                <div class="card shadow-sm mb-4">
                    <div class="card-body">

                        <form id="formProducto" class="row g-3">

                            <div class="col-md-3">
                                <input type="text" class="form-control" id="id" placeholder="ID">
                            </div>

                            <div class="col-md-5">
                                <input type="text" class="form-control" id="descripcion" placeholder="Descripcion">
                            </div>

                            <div class="col-md-4">
                                <select id="departamento" class="form-select">
                                    <option value="">Departamento</option>
                                    <option>Frutas</option>
                                    <option>Verduras</option>
                                    <option>Lácteos</option>
                                </select>
                            </div>

                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-primary px-4">Guardar</button>
                            </div>

                        </form>

                    </div>
                </div>

            
                <div class="d-flex gap-2 mb-3">
                    <button class="btn btn-outline-dark" onclick="renderizar()">Todos</button>
                    <button class="btn btn-outline-success">Frutas</button>
                    <button class="btn btn-outline-warning" >Verduras</button>
                    <button class="btn btn-outline-info">Lácteos</button>
                    <button class="btn btn-outline-danger" onclick="toggleLista()">Mostrar / Ocultar</button>
                </div>

               
                <div class="card shadow-sm" id="contenedorTabla">
                    <div class="card-body">

                        <h5 class="mb-3">Productos registrados</h5>

                        <table class="table table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Descripción</th>
                                    <th>Departamento</th>
                                </tr>
                            </thead>
                            <tbody id="tablaProductos"></tbody>
                        </table>

                    </div>
                </div>

            </main>

        </div>
    </div>

    <script src="Practica2.js"></script>

</body>
</html>
